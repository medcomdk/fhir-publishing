name: Update Publisher

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  update-publisher:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest HL7 release
        run: |
          LATEST_RELEASE=$(
            curl -sL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/HL7/fhir-ig-publisher/releases/latest \
              | jq -r .tag_name
          )

          echo "LATEST_RELEASE=$LATEST_RELEASE" >> $GITHUB_ENV

      - name: Print latest release
        run: |
          echo "Latest release: $LATEST_RELEASE"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/medcomdk/medcom-github-actions-container:${LATEST_RELEASE}-with-firely-terminal \
            --build-arg IG_PUB_VERSION=${LATEST_RELEASE} \
            .
